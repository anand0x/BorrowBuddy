    <path d="M160 32 L288 104 L160 176 L32 104 Z" fill="#FFFFFF" fill-opacity="0.95" />
    <path d="M32 128 L144 192 L144 288 L32 224 Z" fill="#E0E7FF" fill-opacity="0.8" />
    <path d="M176 192 L288 128 L288 224 L176 288 Z" fill="#C7D2FE" fill-opacity="0.9" />
